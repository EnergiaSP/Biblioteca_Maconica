name: Verificação

# Runs on every pull request and on main: the parity gate (shared rules, golden cases of the
# dossier and of the assisted interpretation, deep audit) and the Android unit tests and builds.
# iOS tests still run locally: they need a macOS runner with Xcode 26.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paridade:
    name: Gate de paridade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar paridade iOS/Android
        run: bash Tools/verificar_paridade.sh

  android:
    name: Android (testes e compilação)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Plataforma e ferramentas do SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Testes unitários e compilação (app e Wear OS)
        run: gradle -p projetos/BreviarioMaconicoAndroid :app:testDebugUnitTest :app:assembleDebug :wear:assembleDebug
